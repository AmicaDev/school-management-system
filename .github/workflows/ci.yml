name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: school_db, POSTGRES_USER: school_user, POSTGRES_PASSWORD: ci-only-password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school_user" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "True"
      DATABASE_NAME: school_db
      DATABASE_USER: school_user
      DATABASE_PASSWORD: ci-only-password
      DATABASE_HOST: localhost
      TEST_WITH_POSTGRES: "1"
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - name: Generate migrations (skipped automatically once they are committed)
        run: python manage.py makemigrations --noinput
      - run: python manage.py check
      - run: python manage.py test tests -v 2

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env: {VITE_API_BASE_URL: /api/v1}

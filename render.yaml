# Render Blueprint: New + > Blueprint > pick this repo. Deploys the Django API + PostgreSQL.
# The React frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md).
databases:
  - name: school-db
    databaseName: school_db
    user: school_user
    plan: free            # free Render databases expire after 30 days - use a paid plan (or Neon/Supabase) for real schools

services:
  - type: web
    name: school-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free            # free web services sleep when idle and have an ephemeral disk
    healthCheckPath: /api/v1/developer/status/
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: school-db, property: connectionString}
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"                       # one process so the maintenance-mode flag is shared (no Redis needed)
      - key: AUTO_MAKEMIGRATIONS         # migrations are committed; deployments apply them with migrate
        value: "False"
      - key: SERVE_MEDIA                 # no Nginx on Render: let Django serve uploaded logos/photos
        value: "True"
      - key: CORS_ALLOWED_ORIGINS        # e.g. https://your-app.vercel.app
        sync: false
      - key: CSRF_TRUSTED_ORIGINS        # same value as above
        sync: false
      - key: FRONTEND_URL                # e.g. https://your-app.vercel.app
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME    # first start only: creates the first admin. Delete these 3 variables afterwards.
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_DEVELOPER_USERNAME
        sync: false
      - key: BOOTSTRAP_DEVELOPER_EMAIL
        sync: false
      - key: BOOTSTRAP_DEVELOPER_PASSWORD
        sync: false
      - key: TIME_ZONE
        value: Africa/Kampala
